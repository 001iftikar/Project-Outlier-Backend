server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  application:
    name: outlier
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 31536000000
brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${BREVO_SENDER_EMAIL}
  sender-name: ${BREVO_SENDER_NAME}
github:
  token: ${GITHUB_TOKEN}
google:
  safe-browsing:
    api-key: ${GOOGLE_SAFE_BROWSING_API_KEY}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
